<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            padding: 20px;
            margin: 0;
        }
        h2 {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2 !important;
            -webkit-print-color-adjust: exact;
            color-adjust: exact;
        }
        /* إخفاء أيقونات الطباعة إذا ظهرت في الـ PDF */
        @media print {
            body { margin: 0; padding: 0; }
        }
    </style>
</head>
<body onload="window.print()">

    <h2>{{ .Title }}</h2>

    <table>
        <thead>
            <tr>
                <th>رقم التسلسل</th>
                <th>الاسم</th>
                <th>الهاتف</th>
                <th>عدد المرافقين</th>
            </tr>
        </thead>
        <tbody>
            {{ range .Guests }}
            <tr>
                <td>{{ .ID }}</td>
                <td>{{ .Name }}</td>
                <td>{{ .Phone }}</td>
                <td>{{ .Companions }}</td>
            </tr>
            {{ else }}
            <tr>
                <td colspan="4">لا توجد بيانات متاحة للطباعة.</td>
            </tr>
            {{ end }}
        </tbody>
    </table>

</body>
</html>
