<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الحضور</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: {{ .Settings.PrimaryColor }};
            --secondary: {{ .Settings.SecondaryColor }};
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f8f5f0 0%, #e9e4d9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        .badge {
            background: #f1c40f;
            color: #333;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 15px;
        }
        h1 {
            font-family: 'Amiri', serif;
            color: #2c3e50;
            font-size: 28px;
            margin: 0 0 8px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 15px;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            box-sizing: border-box;
            text-align: center;
            font-size: 17px;
            font-family: 'Tajawal', sans-serif;
            transition: 0.3s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(107,112,69,0.15);
        }
        button {
            width: 100%;
            padding: 15px;
            background: #1b4332;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            transition: 0.3s;
        }
        button:hover { background: #081c15; }
        .error {
            color: #e74c3c;
            margin-top: 12px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">إدخل رقم الجوال الخاص بك</span>
        <h1>تأكيد الحضور</h1>
        <p class="subtitle">{{ .Settings.EventTitle }} - {{ .Settings.Person1 }} {{ if .Settings.Person2 }}و {{ .Settings.Person2 }}{{ end }}</p>
        
        <form id="loginForm">
            <input type="tel" id="phone" placeholder="رقم الجوال" required>
            <button type="submit">متابعة</button>
            <div id="errorMsg" class="error">عفواً، الرقم غير مسجل لدينا.</div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone })
            })
            .then(response => response.json())
            .then(data => {
                if (data.token) {
                    window.location.href = "/invite/" + data.token;
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
