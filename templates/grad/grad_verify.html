<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحقق الحضور — تخرج</title>
  <style>
    body { font-family: Tahoma; background: #1a365d; color: #fff; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .box { background: rgba(255,255,255,0.12); padding: 28px; border-radius: 14px; text-align: center; max-width: 360px; }
  </style>
</head>
<body>
  <div class="box">
    {{ if .Error }}
      <h2>❌</h2>
      <p>{{ .Error }}</p>
    {{ else }}
      <h2>🎓 {{ .Name }}</h2>
      <p>المرافقون: {{ .Companions }}</p>
      <p>{{ if .CheckedIn }}تم تسجيل الدخول{{ else }}باركود صالح{{ end }}</p>
    {{ end }}
  </div>
</body>
</html>
