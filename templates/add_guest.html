<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مدعو جديد - لوحة التحكم</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #1b4332;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #2c3e50;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #1b4332;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #1b4332;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #081c15;
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            display: none;
            font-size: 14px;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>إضافة مدعو جديد ✉️</h2>
        
        <form id="addGuestForm">
            <div class="form-group">
                <label for="name">اسم المدعو/المدعوة</label>
                <input type="text" id="name" placeholder="أدخل الاسم الكامل" required>
            </div>

            <div class="form-group">
                <label for="phone">رقم الجوال</label>
                <input type="tel" id="phone" placeholder="مثال: 0501234567" required>
            </div>

            <div class="form-group">
                <label for="companions">عدد المرافقين المسموح بهم</label>
                <input type="number" id="companions" placeholder="0" min="0" value="0" required>
            </div>

            <button type="submit">إضافة توليد الباركود</button>
        </form>

        <div id="msgSuccess" class="alert alert-success">تمت إضافة المدعو وتوليد الباركود بنجاح!</div>
        <div id="msgError" class="alert alert-error">حدث خطأ أثناء الإضافة!</div>
    </div>

    <script>
        document.getElementById('addGuestForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const companions = parseInt(document.getElementById('companions').value) || 0;

            const successBox = document.getElementById('msgSuccess');
            const errorBox = document.getElementById('msgError');

            // إخفاء التنبيهات السابقة
            successBox.style.display = 'none';
            errorBox.style.display = 'none';

            fetch('/api/guests', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: name,
                    phone: phone,
                    companions: companions
                })
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw err; });
                }
                return response.json();
            })
            .then(data => {
                successBox.innerText = "تمت إضافة " + data.data.Name + " بنجاح!";
                successBox.style.display = 'block';
                document.getElementById('addGuestForm').reset();
            })
            .catch(error => {
                errorBox.innerText = error.error || "حدث خطأ أثناء الإضافة!";
                errorBox.style.display = 'block';
            });
        });
    </script>

</body>
</html>
