<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f9f8f3; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 400px; width: 100%; text-align: center; }
        .details-box { background-color: #f1c40f; padding: 10px; border-radius: 10px; display: inline-block; margin-bottom: 20px; font-weight: bold; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }
        .btn { padding: 15px; border: 1px solid #1b4332; border-radius: 10px; font-size: 16px; cursor: pointer; background: white; color: #1b4332; font-weight: bold; transition: 0.3s; }
        .btn:hover { background-color: #1b4332; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2>زواج حمد ونورة</h2>
        <div class="details-box">
            تفاصيل المناسبة<br>واسم المدعوة<br>وعدد المرافقين
        </div>
        
        <h3>حياك الله يا : {{ .Name }}</h3>
        <p>عدد المرافقين : {{ .Companions }}</p>

        <div class="btn-group">
            <button class="btn" onclick="sendRSVP('confirmed')">تأكيد الحضور</button>
            <button class="btn" onclick="sendRSVP('declined')">أعتذر عن الحضور</button>
        </div>
    </div>
<script>
    const guestToken = "{{ .Token }}";
    function sendRSVP(status) {
        fetch('/api/rsvp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: guestToken, status: status })
        })
        .then(response => response.json())
        .then(data => {
            if (status === 'confirmed') {
                window.location.href = "/ticket/" + guestToken;
            } else {
                // استبدال محتوى الكارد برسالة لطيفة
                document.querySelector('.card').innerHTML = `
                    <div style="padding: 20px;">
                        <h2 style="color: #e74c3c; margin-bottom: 15px;">تم تسجيل اعتذارك 🌸</h2>
                        <p style="font-size: 16px; color: #7f8c8d; line-height: 1.8;">
                            مقدرين ظروفك، ونتمنى أن تشاركنا أفراحنا في مناسبات قادمة بإذن الله.<br>شكراً لك.
                        </p>
                    </div>
                `;
            }
        });
    }
</script>
</body>
</html>
