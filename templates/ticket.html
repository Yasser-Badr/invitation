<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>بطاقة الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: {{ .Settings.PrimaryColor }};
            --secondary: {{ .Settings.SecondaryColor }};
            --border-color: #c4a78b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #d8cec0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .ticket-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: auto;
            padding-top: 30px; 
        }
        .id-tag {
            position: absolute;
            top: 5px;
            left: 20px;
            width: 85px; /* تم تكبير التيكت */
            z-index: 10;
        }
        .id-tag img {
            width: 100%;
            display: block;
        }
        .id-text {
            position: absolute;
            top: 60%; /* تم ضبط المحاذاة الرأسية بعيداً عن خيط التيكت */
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px; /* تم تكبير الخط */
            font-weight: 700;
            color: #1a1a1a;
            font-family: 'Tajawal', sans-serif;
            letter-spacing: 1px;
        }
        .ticket {
            background: #fbf9f6;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            padding: 40px 25px 25px;
            text-align: center;
            overflow: hidden;
            z-index: 1;
        }
        .leaf-top {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 170px;
            z-index: -1;
            opacity: 0.9;
            pointer-events: none;
        }
        .leaf-bottom {
            position: absolute;
            bottom: 60px;
            left: -30px;
            width: 140px;
            z-index: -1;
            opacity: 0.85;
            pointer-events: none;
        }
        .content-layer {
            position: relative;
            z-index: 2;
        }
        .label {
            color: #777;
            font-size: 15px;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .event-title {
            font-family: 'Amiri', serif;
            font-size: 34px;
            font-weight: 700;
            color: #b38b6d;
            margin-bottom: 5px;
        }
        .event-sub {
            font-size: 16px;
            color: #888;
            margin-bottom: 35px;
        }
        .info {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            padding: 0 15px;
        }
        .info-row {
            display: flex;
            align-items: center;
            justify-content: flex-start; /* تم ضبط المحاذاة لتبدأ من اليمين */
            gap: 12px;
            font-size: 16px;
            color: #333;
        }
        .info-row strong {
            font-weight: 700;
            color: #1a1a1a;
        }
        .info-row svg {
            stroke: #777;
            min-width: 22px;
            height: 22px;
        }
        .qr-container {
            background: #fff;
            padding: 12px;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(180, 150, 120, 0.15);
            border: 1px solid rgba(196, 167, 139, 0.3);
            width: max-content;
            margin: 0 auto 15px;
        }
        .qr-container img {
            display: block;
            width: 170px;
            height: 170px;
            object-fit: contain;
        }
        .qr-text p {
            color: #555;
            font-size: 14px;
            margin: 6px 0;
            font-weight: 500;
        }
        .actions {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            text-decoration: none;
            background: transparent;
            color: #333;
            border: 1.5px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn svg {
            stroke: #a47d5e;
            width: 18px;
            height: 18px;
        }
        .btn:hover {
            background: rgba(196, 167, 139, 0.05);
        }

        @media print {
            body { background: none; }
            .ticket-wrapper { margin: 0; box-shadow: none; max-width: 100%; padding-top: 0; }
            .ticket { box-shadow: none; border: 1px solid #ccc; }
            .actions, .id-tag { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="ticket-wrapper" id="ticketCard">
        
        <!-- تيكت الرقم -->
        <div class="id-tag">
            <img crossorigin="anonymous" src="https://raw.githubusercontent.com/Yasser-Badr/images/main/vecteezy_blank-brown-paper-tag-with-string-cut-out_58282078.png" alt="Tag">
            <div class="id-text">#{{ .ID }}</div>
        </div>

        <div class="ticket">
            <!-- الشجر الزخرفي بالأطراف -->
            <img crossorigin="anonymous" src="https://raw.githubusercontent.com/Yasser-Badr/images/main/reverse-2-AoPZwDMZKvfGB0eQ.png" class="leaf-top" alt="">
            <img crossorigin="anonymous" src="https://raw.githubusercontent.com/Yasser-Badr/images/main/canva-aquarell-eukalyptusblatt-illustration-MAGdAoz6c5A.png" class="leaf-bottom" alt="">

            <div class="content-layer">
                <div class="label">بطاقة دخول خاصة</div>
                <div class="event-title">{{ .Settings.EventTitle }}</div>
                <div class="event-sub">
                    {{ .Settings.Person1 }}{{ if .Settings.Person2 }} و {{ .Settings.Person2 }}{{ end }}
                </div>

                <!-- بيانات الضيف مصفوفة لليمين -->
                <div class="info">
                    <div class="info-row">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span>اسم الضيف: <strong>{{ .Name }}</strong></span>
                    </div>
                    <div class="info-row">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
                        <span>رقم الجوال: <strong dir="ltr">{{ .Phone }}</strong></span>
                    </div>
                    <div class="info-row">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        <span>عدد المرافقين: <strong>{{ .Companions }}</strong></span>
                    </div>
                </div>

                <!-- الباركود -->
                                <!-- الأزرار -->
                <div class="actions">
                    <a class="btn" href="{{ .Settings.MapsURL }}" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        <span>زيارة الموقع</span>
                    </a>
                    <button type="button" class="btn" onclick="saveTicketImage()">
                        <span style="font-size: 18px;">📲</span>
                        <span id="saveBtnText">حفظ البطاقة كصورة</span>
                    </button>
                    <button type="button" class="btn" onclick="printTicket()">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                        <span>طباعة البطاقة</span>
                    </button>
                </div>

            </div>
        </div>
    </div>

<script>
function printTicket() {
    try {
        window.print();
    } catch (e) {
        alert("الطباعة غير متاحة على هذا الجهاز. استخدم زر حفظ كصورة.");
    }
}

function saveTicketImage() {
    const btnText = document.getElementById('saveBtnText');
    const oldText = btnText.innerText;
    btnText.innerText = "جاري الحفظ...";
    const btns = document.querySelectorAll('.btn');
    btns.forEach(b => b.style.pointerEvents = 'none'); 

    const card = document.getElementById('ticketCard');
    const actions = card.querySelector('.actions');

    actions.style.display = 'none';

    const qr = document.getElementById('qrImg');
    const doCapture = () => {
        html2canvas(card, {
            backgroundColor: null, 
            scale: 2,
            useCORS: true,
            allowTaint: true
        }).then(canvas => {
            actions.style.display = 'flex';

            const link = document.createElement('a');
            link.download = 'ticket-{{ .ID }}.png';
            link.href = canvas.toDataURL('image/png');
            link.click();

            if (/iPhone|iPad|Android/i.test(navigator.userAgent)) {
                const data = canvas.toDataURL('image/png');
                const w = window.open('');
                if (w) {
                    w.document.write('<img src="' + data + '" style="width:100%">');
                    w.document.write('<p style="text-align:center;font-family:sans-serif;margin-top:20px;">اضغط مطولاً على الصورة واختر حفظ</p>');
                }
            }

            btnText.innerText = oldText;
            btns.forEach(b => b.style.pointerEvents = 'auto');
        }).catch(err => {
            actions.style.display = 'flex';
            btnText.innerText = oldText;
            btns.forEach(b => b.style.pointerEvents = 'auto');
            alert("تعذر حفظ الصورة. جرّب زر الطباعة أو أخذ لقطة شاشة.");
            console.error(err);
        });
    };

    if (qr && !qr.complete) {
        qr.onload = doCapture;
        setTimeout(doCapture, 1000);
    } else {
        doCapture();
    }
}
</script>
</body>
</html>
